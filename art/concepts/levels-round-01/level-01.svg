<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 855" role="img" aria-labelledby="title desc">
<title id="title">Level 1: First Service</title>
<desc id="desc">Top-down kitchen floor plan. A perimeter kitchen leaves the middle open. The two ingredients sit together; the return tray, sink and plate rack form one short washing route. Coloured lines show example task routes. Dark short marks show station interaction edges. All stations are accessible without dash or throwing.</desc>
