<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 855" role="img" aria-labelledby="title desc">
<title id="title">Level 2: Something Simmering</title>
<desc id="desc">Top-down kitchen floor plan. The wider kitchen separates preparation from cooking. A clear horizontal aisle gives dash a useful role, while the sink and bowl rack remain together. Coloured lines show example task routes. Dark short marks show station interaction edges. All stations are accessible without dash or throwing.</desc>
