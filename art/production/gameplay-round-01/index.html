<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bara Kitchen · Playable demo</title><link rel="icon" href="../../brand/round-01/bara-kitchen-icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cad6a8;color:#5d452f;font-family:system-ui,sans-serif}.stage{position:fixed;inset:0;overflow:hidden}canvas{width:100%;height:100%;display:block;outline:none}.loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#cad6a8;padding:30px}.loading-card{padding:36px 55px;border:5px solid #996938;border-bottom-width:10px;border-radius:35px;background:#fff2cc;box-shadow:0 20px 0 #93a56a50;transform:rotate(-2deg)}.loading h1{font-size:48px;color:#76502e;font-family:Georgia,serif;margin:8px}.loading p{color:#778150}.loading .paw{font-size:48px}.bar{height:14px;width:280px;max-width:70vw;margin:22px auto;background:#ddc79b;border:3px solid #b89963;border-radius:12px;overflow:hidden}.fill{height:100%;width:0;background:#82a35b}.loading small{font-size:12px;color:#928257}#fullscreen{position:absolute;right:12px;bottom:9px;border:0;background:#fff3ca99;color:#687c4a;border-radius:8px;padding:5px 8px;cursor:pointer;font:12px system-ui;opacity:.45}#fullscreen:hover{opacity:1}#fullscreen:focus-visible{outline:2px solid #678144;opacity:1}
</style>
<div class="stage" id="stage"><canvas id="unity-canvas" width="1280" height="900" tabindex="0" aria-label="Bara Kitchen 游戏"></canvas><div class="loading" id="loading"><div class="loading-card"><div class="paw">🐾</div><h1>Bara Kitchen</h1><p id="loading-text">正在打开小动物餐厅…</p><div class="bar"><div class="fill" id="fill"></div></div><small>正在准备食材，马上开门营业。</small></div></div><button id="fullscreen" title="全屏游戏">⛶</button></div>
<script src="live-chat.js?v=gpt-live-01"></script>
<script>
const canvas=document.getElementById('unity-canvas');window.unityErrors=[];const loading=document.getElementById('loading');
const script=document.createElement('script');script.src='web/Build/web.loader.js?v=gpt-live-01';script.onload=()=>createUnityInstance(canvas,{dataUrl:'web/Build/web.data?v=gpt-live-01',frameworkUrl:'web/Build/web.framework.js?v=gpt-live-01',codeUrl:'web/Build/web.wasm?v=gpt-live-01',streamingAssetsUrl:'web/StreamingAssets',companyName:'Bara Kitchen',productName:'Bara Kitchen',productVersion:'0.2.0',matchWebGLToCanvasSize:true,showBanner:(message,type)=>{if(type==='error'){window.unityErrors.push(message);document.getElementById('loading-text').textContent=message}}},progress=>{document.getElementById('fill').style.width=Math.round(progress*100)+'%';document.getElementById('loading-text').textContent='正在准备厨房… '+Math.round(progress*100)+'%'}).then(instance=>{window.unityInstance=instance;loading.style.display='none';canvas.focus()}).catch(error=>{window.unityErrors.push(String(error));document.getElementById('loading-text').textContent='载入失败：'+error});script.onerror=()=>{document.getElementById('loading-text').textContent='游戏资源尚未就绪，请稍后刷新。'};document.body.append(script);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});document.getElementById('fullscreen').onclick=()=>document.getElementById('stage').requestFullscreen();
</script></html>
